databaseChangeLog:
  - changeSet:
      id: 0007-add-password-to-users
      author: system
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

  - changeSet:
      id: tag-0007
      author: system
      changes:
        - tagDatabase:
            tag: "0007"
