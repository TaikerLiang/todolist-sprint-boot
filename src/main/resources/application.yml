spring:
  application:
    name: todolist

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:demo}
    username: ${DB_USER:default_user}
    password: ${DB_PASSWORD:default_pass}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: true # Must be set for SnapAdmin to work correctly

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

snapadmin:
  enabled: true
  baseUrl: admin
  modelsPackage: com.example.todolist.model

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
    expiration: 900 # 15 minutes in seconds
  refresh:
    secret: ${JWT_REFRESH_SECRET}
    expiration: 1209600 # 14 days in seconds
    grace-period: 30 # 30 seconds for rotation tolerance
  issuer: todolist-api